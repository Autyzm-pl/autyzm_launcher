name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.1.0. Empty = current ref"
        required: false
        type: string

permissions: {}

jobs:
  build_release:
    name: Build release binaries
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      build-type: Release
    secrets: inherit

  create_release:
    name: Create draft GitHub release
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: true
          path: AutyzmLauncher-source

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Determine version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag || '' }}" ]; then
            VERSION="${{ inputs.tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Normalize artifact names
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mv "$GITHUB_WORKSPACE/AutyzmLauncher-source" "AutyzmLauncher-${VERSION}"
          tar --exclude='.git' -czf "AutyzmLauncher-${VERSION}.tar.gz" "AutyzmLauncher-${VERSION}"

          # Linux x86_64 AppImage + zsync + portable tarball
          appimages=(AutyzmLauncher-*.AppImage/AutyzmLauncher-*-x86_64.AppImage)
          if [ ${#appimages[@]} -gt 0 ]; then
            mv "${appimages[0]}" AutyzmLauncher-Linux-x86_64.AppImage
          fi
          zsyncs=(AutyzmLauncher-*.AppImage.zsync/AutyzmLauncher-*-x86_64.AppImage.zsync)
          if [ ${#zsyncs[@]} -gt 0 ]; then
            mv "${zsyncs[0]}" AutyzmLauncher-Linux-x86_64.AppImage.zsync
          fi
          linux_portable=(AutyzmLauncher-Linux-Qt6-Portable*/AutyzmLauncher-portable.tar.gz)
          if [ ${#linux_portable[@]} -gt 0 ]; then
            mv "${linux_portable[0]}" "AutyzmLauncher-Linux-Qt6-Portable-${VERSION}.tar.gz"
          fi

          # macOS universal ZIP + DMG
          mac_zip=(AutyzmLauncher-macOS*/AutyzmLauncher.zip)
          if [ ${#mac_zip[@]} -gt 0 ]; then
            mv "${mac_zip[0]}" "AutyzmLauncher-macOS-${VERSION}.zip"
          fi
          mac_dmg=(AutyzmLauncher-macOS*.dmg/AutyzmLauncher.dmg AutyzmLauncher-macOS*/AutyzmLauncher.dmg)
          if [ ${#mac_dmg[@]} -gt 0 ]; then
            mv "${mac_dmg[0]}" "AutyzmLauncher-macOS-${VERSION}.dmg"
          fi

          # Windows MSVC install tree -> zip, portable tree -> zip, NSIS installer -> exe
          for d in AutyzmLauncher-Windows-MSVC-*Release; do
            [ -d "$d" ] || continue
            case "$d" in
              *-Setup-*)
                exe=("$d"/AutyzmLauncher-Setup.exe)
                [ -f "${exe[0]}" ] && mv "${exe[0]}" "AutyzmLauncher-Windows-MSVC-Setup-${VERSION}.exe"
                ;;
              *-Portable-*)
                (cd "$d" && zip -r -9 "../AutyzmLauncher-Windows-MSVC-Portable-${VERSION}.zip" .)
                ;;
              *)
                (cd "$d" && zip -r -9 "../AutyzmLauncher-Windows-MSVC-${VERSION}.zip" .)
                ;;
            esac
          done

          echo "Prepared release files:"
          ls -lh AutyzmLauncher-* || true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.VERSION }}
          name: Autyzm Launcher ${{ env.VERSION }}
          draft: true
          prerelease: ${{ contains(env.VERSION, 'alpha') || contains(env.VERSION, 'beta') || contains(env.VERSION, 'rc') }}
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            AutyzmLauncher-Linux-x86_64.AppImage
            AutyzmLauncher-Linux-x86_64.AppImage.zsync
            AutyzmLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            AutyzmLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            AutyzmLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            AutyzmLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            AutyzmLauncher-macOS-${{ env.VERSION }}.zip
            AutyzmLauncher-macOS-${{ env.VERSION }}.dmg
            AutyzmLauncher-${{ env.VERSION }}.tar.gz
